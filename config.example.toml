# 실험 고유 값. 복사해서 config.toml을 만들고, 실제 로그에 맞춰 고쳐 쓴다.
#
#   cp config.example.toml config.toml
#
# config.toml은 커밋하지 않는다(.gitignore). 여기 있는 값은 자리를 잡아두기 위한
# 플레이스홀더이며 실제 실험의 키 이름·차원이 아니다.
#
# 서로게이트의 튜닝 파라미터(k, trust_dist, min_obs ...)는 여기 없다.
# 그건 데이터가 아니라 탐색 전략의 선택이라 MOCKCalculator.MockConfig에 남는다.

[keys]
# raw/*.jsonl 한 줄에 나타나는 키 이름.
x = "x"                                   # 입력 code batch
array = ["yARR1_key", "yARR2_key"]        # bool 5D array (batch 포함 6D로 기록됨)
list = ["yLST1_key", "yLST2_key"]         # x 하나당 list. 그 평균이 최소화 목적함수
scalar = ["y1_cfg_key", "y2_cfg_key"]     # batch 공통 설정값. 목적함수가 아니다

[ingest]
axis1_size = 4        # 배열 내부 축1의 고정 크기. 축 0/1 뒤바뀜 판정에 쓰인다
raw_dir = "raw"       # TRUE_CALCULATOR 실행 로그
db_dir = "database"   # ingest 산출물
